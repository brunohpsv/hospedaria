<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Redirecionando...</title>
    <script>
      // Single Page App redirect for GitHub Pages
      var pathSegments = location.pathname.split('/').filter(Boolean);
      // Keep base repo path if under a subpath
      var repo = pathSegments.length > 0 ? '/' + pathSegments[0] + '/' : '/';
      location.replace(repo);
    </script>
  </head>
  <body>
    Redirecionando para a página inicial...
  </body>
</html>
